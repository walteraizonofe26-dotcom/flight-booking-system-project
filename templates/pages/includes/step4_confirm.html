<div class="confirmation-container card">
    <div class="success-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    
    <h2>Booking Confirmed!</h2>
    <p>Your flight has been successfully booked. A confirmation email has been sent to <strong id="conf-email"></strong>.</p>

    <div class="booking-id-box">
        <span>Booking Reference:</span>
        <h3 id="conf-booking-ref">-------</h3>
    </div>

    <hr>

    <div class="trip-summary">
        <h4>Trip Details</h4>
        <div id="conf-details">
            </div>
    </div>

    <div class="form-actions no-print">
        <button type="button" class="print-btn" onclick="window.print()">
            <i class="fas fa-print"></i> Print Ticket
        </button>
        <button type="button" class="home-btn" onclick="location.href='/'">
            Go to Home
        </button>
    </div>
</div>
