<div class="step-header" style="padding: 20px 40px 0;">
    <h2><i class="fas fa-users"></i> Passenger Details</h2>
    <p>Please enter information exactly as it appears on official documents.</p>
</div>

<div class="passenger-layout" style="display: flex; gap: 30px; padding: 20px 40px;">
    <div id="passenger-sidebar" style="flex: 1; max-width: 250px;"></div>
    <div id="passenger-form-container" style="flex: 3;"></div>
</div>

    <div id="final-steps-container" style="padding: 0 40px; display: none;">
    <div class="contact-info-section" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h3 style="margin-bottom: 20px; color: #0056b3;">Contact Information</h3>
        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Contact Email</label>
                <input type="email" id="contactEmail" class="form-input" placeholder="Ticket will be sent here">
                <span class="error-msg" id="err-contactEmail" style="color: #dc3545; font-size: 0.8rem; display: none;">Please enter a valid email.</span>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="contactPhone" class="form-input" placeholder="Mobile number">
                <span class="error-msg" id="err-contactPhone" style="color: #dc3545; font-size: 0.8rem; display: none;">Please enter your phone number.</span>
            </div>
        </div>
        
        <div class="form-actions" style="margin-top: 30px; display: flex; justify-content: flex-end;">
            <button type="button" class="continue-btn" onclick="validateContactAndPay()" style="background: #28a745; color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Proceed to Payment <i class="fas fa-credit-card"></i>
            </button>
        </div>
    </div>
</div>
