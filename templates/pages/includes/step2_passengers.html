<div class="step-navigation">
    <div class="step active"><div class="step-circle">1</div><span>Select</span></div>
    <div class="step active"><div class="step-circle">2</div><span>Passengers</span></div>
    <div class="step"><div class="step-circle">3</div><span>Payment</span></div>
    <div class="step"><div class="step-circle">4</div><span>Confirm</span></div>
</div>

<div class="step-header">
    <h2><i class="fas fa-users"></i> Passenger Details</h2>
    <p>Please enter the information as it appears on official travel documents.</p>
</div>

<form id="passengerDetailsForm">
    <div id="passenger-forms-container"></div>

    <hr>
    <h3>Contact Information</h3>
    <div class="form-grid">
        <div class="form-group">
            <label>Contact Email</label>
            <input type="email" id="contactEmail" class="form-input" required placeholder="For your ticket delivery">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="contactPhone" class="form-input" required>
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="back-btn" onclick="switchStep(1)">Back to Flights</button>
        <button type="submit" class="continue-btn">Continue to Payment</button>
    </div>
</form>
